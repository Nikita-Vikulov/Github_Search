build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 1
    Style: 1

config:
  validation: true
  warningsAsErrors: false

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']

style:
  WildcardImport:
    active: false
  UnusedImports:
    active: true
  NewLineAtEndOfFile:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 160
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNumbers: ['-1', '0', '1', '2', '4', '8', '12', '16', '24', '500']

empty-blocks:
  EmptyFunctionBlock:
    active: true

complexity:
  LongMethod:
    active: true
    threshold: 120
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
  CyclomaticComplexMethod:
    active: true
    threshold: 15

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

potential-bugs:
  active: true
